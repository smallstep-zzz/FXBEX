name: Python package CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: python -m pip install . build twine
      - name: Install CPU-only PyTorch for replay contract tests
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests (no NPU required)
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Audit public distribution members
        run: python scripts/check_dist.py dist/*
      - name: Verify command-line entry point
        run: fxbex --help
