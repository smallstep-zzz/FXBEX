[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fxbex"
version = "0.2.1"
description = "Furiosa RNGD compiled artifact packaging and runtime CLI"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
fxbex = "fxbex.cli:main"

[tool.setuptools.packages.find]
include = ["fxbex*"]
